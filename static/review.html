<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entry Review Queue</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
  .field { margin-bottom: 12px; }
  label { font-weight: bold; display: block; }
  textarea, input { width: 100%; font-size: 1rem; padding: 6px; box-sizing: border-box; }
  .reasons { color: #b00020; font-weight: bold; }
  button { padding: 8px 16px; margin-right: 8px; font-size: 1rem; cursor: pointer; }
  .nav-row { margin-bottom: 20px; }
  .nav-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  #position { font-weight: bold; margin-right: 16px; }
  #message { color: green; font-weight: bold; }
</style>
</head>
<body>
<h1>Entry Review Queue</h1>

<!-- Navigation row: moves through the queue by offset, without approving,
     editing, or rejecting anything. Separate from the action buttons below,
     which change the database. -->
<div class="nav-row">
  <span id="position"></span>
  <button id="prev-btn" onclick="goToPrevious()">&larr; Previous</button>
  <button id="next-btn" onclick="goToNext()">Next &rarr;</button>
</div>

<div id="message"></div>
<div id="entry-container">Loading...</div>

<script>
let currentEntry = null;
let currentOffset = 0;

/**
 * Load and display the entry at currentOffset, without changing the
 * database. Used by Previous/Next navigation and on initial page load.
 */
async function loadEntryAtOffset() {
  document.getElementById("message").textContent = "";
  const res = await fetch(`/entries/needs-review?limit=1&offset=${currentOffset}`);
  const entries = await res.json();
  const container = document.getElementById("entry-container");

  document.getElementById("position").textContent = `Entry #${currentOffset + 1}`;
  document.getElementById("prev-btn").disabled = currentOffset === 0;

  if (entries.length === 0) {
    if (currentOffset === 0) {
      container.innerHTML = "<p>No entries need review. Queue is empty!</p>";
    } else {
      // Ran past the end of the queue (e.g. clicked Next repeatedly) --
      // step back one and show the last real entry instead of a blank page.
      currentOffset -= 1;
      await loadEntryAtOffset();
      return;
    }
    currentEntry = null;
    document.getElementById("next-btn").disabled = true;
    return;
  }

  document.getElementById("next-btn").disabled = false;
  currentEntry = entries[0];
  container.innerHTML = `
    <div class="field"><label>Headword</label>
      <input id="headword" value="${escapeHtml(currentEntry.headword)}"></div>
    <div class="field"><label>Part of Speech</label>
      <input id="pos" value="${escapeHtml(currentEntry.part_of_speech)}"></div>
    <div class="field"><label>Definition</label>
      <textarea id="definition" rows="4">${escapeHtml(currentEntry.definition)}</textarea></div>
    <div class="field">Source: ${escapeHtml(currentEntry.source_file)}, page ${currentEntry.source_page}</div>
    <div class="field reasons">Flagged: ${currentEntry.review_reason || "none"}</div>
    <button onclick="approveEntry()">Approve</button>
    <button onclick="saveEdits()">Save Edit</button>
    <button onclick="rejectEntry()">Reject</button>
  `;
}

function goToNext() {
  currentOffset += 1;
  loadEntryAtOffset();
}

function goToPrevious() {
  if (currentOffset === 0) return;
  currentOffset -= 1;
  loadEntryAtOffset();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function approveEntry() {
  if (!currentEntry) return;
  await fetch(`/entries/${currentEntry.id}`, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({needs_review: false, review_reason: null})
  });
  document.getElementById("message").textContent = "Approved.";
  // The approved entry drops out of needs-review, so whatever was next
  // shifts into this same offset -- reload the same position, don't advance.
  loadEntryAtOffset();
}

async function saveEdits() {
  if (!currentEntry) return;
  const updated = {
    headword: document.getElementById("headword").value,
    part_of_speech: document.getElementById("pos").value,
    definition: document.getElementById("definition").value,
    needs_review: false,
    review_reason: null
  };
  await fetch(`/entries/${currentEntry.id}`, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(updated)
  });
  document.getElementById("message").textContent = "Saved and approved.";
  loadEntryAtOffset();
}

async function rejectEntry() {
  if (!currentEntry) return;
  await fetch(`/entries/${currentEntry.id}`, {method: "DELETE"});
  document.getElementById("message").textContent = "Rejected and deleted.";
  loadEntryAtOffset();
}

loadEntryAtOffset();
</script>
</body>
</html>
